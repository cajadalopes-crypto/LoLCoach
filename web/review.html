<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach-Review</title>
<style>
  :root {
    --grund: #0b0f14; --flaeche: #131a22; --flaeche2: #0e141b; --linie: #223040; --text: #e6edf3;
    --leise: #8b9bb0; --freund: #4aa3ff; --feind: #ff5a5a; --ich: #ffd24a; --gut: #3fd08a; --warn: #ffb020;
    --obj: #b48cff; --kampf: #ff8a3d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--grund); color: var(--text); font: 15px/1.4 "Segoe UI", system-ui, sans-serif; }
  button { font: inherit; color: var(--text); background: #1c2835; border: 1px solid var(--linie); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; }
  button:hover { background: #243446; }
  button.haupt { background: #1f4f8a; border-color: #2d6ab3; }
  .rahmen { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  @media (max-width: 900px) { .rahmen { grid-template-columns: 1fr; } }
  nav { border-right: 1px solid var(--linie); padding: 12px; overflow: auto; max-height: 100vh; }
  nav h1 { font-size: 16px; margin: 4px 4px 12px; }
  .partie { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: center; padding: 8px;
    border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .partie:hover { background: var(--flaeche); }
  .partie.aktiv { background: var(--flaeche); border-color: var(--linie); }
  .partie img { width: 36px; height: 36px; border-radius: 50%; }
  .klein { color: var(--leise); font-size: 13px; }
  .win { color: var(--gut); } .lose { color: var(--feind); }
  main { padding: 14px 18px; display: grid; gap: 12px; align-content: start; }
  .kasten { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 10px; padding: 12px 14px; }
  h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--leise); }
  .kopf { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  .kopf .titel { font-size: 22px; font-weight: 700; }
  #zeitleiste { width: 100%; height: 120px; display: block; cursor: pointer; }
  .mitte { display: grid; grid-template-columns: minmax(280px, 520px) 1fr; gap: 12px; }
  @media (max-width: 1200px) { .mitte { grid-template-columns: 1fr; } }
  .karte { position: relative; aspect-ratio: 1; background: #000; border-radius: 8px; overflow: hidden; }
  canvas#karte { width: 100%; height: 100%; display: block; }
  .steuerung { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .uhr { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 64px; }
  .werte { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; margin-top: 8px; }
  .werte div { background: var(--flaeche2); border-radius: 6px; padding: 6px 8px; }
  .werte b { font-variant-numeric: tabular-nums; }
  .lektion { border-left: 3px solid var(--warn); background: var(--flaeche2); border-radius: 6px; padding: 10px 12px;
    margin-bottom: 8px; }
  .lektion.w5, .lektion.w4 { border-left-color: var(--feind); }
  .lektion.staerke { border-left-color: var(--gut); }
  .lektion h3 { margin: 0 0 4px; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
  .lektion p { margin: 4px 0; }
  .lektion .label { color: var(--leise); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .lektion ul { margin: 4px 0 0 18px; padding: 0; color: var(--leise); font-size: 13px; }
  .moment { background: var(--flaeche2); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 14px; }
  .moment b { display: block; margin-bottom: 2px; }
  .moment li { color: var(--leise); }
  .moment ul { margin: 2px 0 0 18px; padding: 0; }
  .gespraech { display: grid; gap: 8px; max-height: 420px; overflow: auto; margin-bottom: 8px; }
  .blase { padding: 8px 12px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; }
  .blase.spieler { justify-self: end; background: #1f3b5c; }
  .blase.coach { justify-self: start; background: var(--flaeche2); border: 1px solid var(--linie); }
  .eingabe { display: flex; gap: 8px; }
  .eingabe textarea { flex: 1; min-height: 44px; resize: vertical; font: inherit; color: var(--text);
    background: var(--flaeche2); border: 1px solid var(--linie); border-radius: 8px; padding: 8px; }
  .leer { color: var(--leise); padding: 40px; text-align: center; }
  a.zeit { color: var(--freund); cursor: pointer; text-decoration: none; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="rahmen">
  <nav><h1>Partien</h1><div id="liste" class="klein">lädt …</div></nav>
  <main id="haupt">
    <div class="leer">Partie links wählen.</div>
  </main>
</div>
<template id="vorlage">
  <div class="kasten kopf">
    <span class="titel" id="titel"></span><span id="ergebnis"></span><span class="klein" id="unterzeile"></span>
    <span style="flex:1"></span><span class="klein" id="status"></span><button class="haupt" id="analyse">Review erstellen</button>
  </div>
  <div class="kasten" id="zusammenfassung" hidden></div>
  <div class="kasten"><h2>Zeitleiste · Itemgold-Vorsprung · Momente</h2><svg id="zeitleiste"></svg>
    <div class="klein">Rot: deine Tode · Orange: Kämpfe · Lila: Objectives · Gelb: gehortetes Gold · Grau: Gold-Schwung · Klick springt hin</div></div>
  <div class="mitte">
    <div class="kasten">
      <div class="karte"><canvas id="karte" width="900" height="900"></canvas></div>
      <div class="steuerung">
        <span class="uhr" id="uhr">0:00</span>
        <button id="zurueck">−10 s</button><button id="spielen">▶</button><button id="vor">+10 s</button>
        <select id="tempo"><option value="1">1×</option><option value="4" selected>4×</option><option value="10">10×</option></select>
      </div>
      <div class="werte" id="werte"></div>
    </div>
    <div>
      <div class="kasten" id="lektionen"><h2>Lektionen</h2><div class="klein">Noch kein Review.</div></div>
      <div class="kasten" style="margin-top:12px"><h2>Was hier passierte</h2><div id="momente" class="klein"></div></div>
    </div>
  </div>
  <div class="kasten"><h2>Mit dem Coach reden</h2>
    <div class="gespraech" id="gespraech"></div>
    <div class="eingabe"><textarea id="frage" placeholder="z. B. Warum war der Tod bei 21:03 mein Fehler? (bezieht sich auch auf den gewählten Zeitpunkt)"></textarea>
      <button class="haupt" id="senden">Fragen</button></div>
  </div>
</template>
<script>
const $ = id => document.getElementById(id);
const uhr = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const bilder = {};
const bild = src => { if (!bilder[src]) { const i = new Image(); i.onload = neuZeichnen; i.src = src; bilder[src] = i; } return bilder[src]; };
const karte = bild('/karte.png');
const FARBE = { tod: '#ff5a5a', kampf: '#ff8a3d', objective: '#b48cff', horten: '#ffb020', schwung: '#6c7a8c', lane: '#3fd08a' };
let P = null, stamm = null, t = 0, spielt = false, letzterTakt = 0;

async function json(url, opt) { const r = await fetch(url, opt); return r.json(); }

async function liste() {
  const ps = await json('/api/partien');
  $('liste').innerHTML = ps.map(p => `<div class="partie" data-stamm="${p.stamm}">
      ${p.id ? `<img src="/icon/${p.id}.png" alt="">` : '<span></span>'}
      <div><div>${p.champion ? `${p.champion} vs ${p.gegner || '?'}` : 'noch nicht ausgewertet'}
        ${p.ergebnis ? `<span class="${p.ergebnis === 'Win' ? 'win' : 'lose'}">${p.ergebnis === 'Win' ? 'Sieg' : p.ergebnis === 'Lose' ? 'Niederlage' : p.ergebnis}</span>` : ''}</div>
      <div class="klein">${p.datum} ${p.uhr}${p.kda ? ' · ' + p.kda : ''}${p.review ? ' · Review' : ''}</div></div></div>`).join('')
    || 'Noch keine Aufnahmen.';
  document.querySelectorAll('.partie').forEach(e => e.onclick = () => oeffne(e.dataset.stamm));
  const aus = new URLSearchParams(location.search).get('partie');
  if (aus) oeffne(aus);
}

async function oeffne(s) {
  stamm = s; spielt = false;
  document.querySelectorAll('.partie').forEach(e => e.classList.toggle('aktiv', e.dataset.stamm === s));
  $('haupt').innerHTML = '<div class="leer">Partie wird ausgewertet …</div>';
  P = await json(`/api/partie/${s}`);
  if (P.fehler) { $('haupt').innerHTML = `<div class="leer">${P.fehler}</div>`; return; }
  $('haupt').innerHTML = ''; $('haupt').append($('vorlage').content.cloneNode(true));
  const ich = P.spieler.find(x => x.ich);
  $('titel').textContent = `${P.champion} gegen ${P.gegner || '?'}`;
  $('ergebnis').innerHTML = P.ergebnis === 'Win' ? '<b class="win">Sieg</b>' : P.ergebnis === 'Lose' ? '<b class="lose">Niederlage</b>' : P.ergebnis;
  $('unterzeile').textContent = `${uhr(P.dauer)} · ${ich.kda} · ${ich.cs} CS`;
  $('analyse').onclick = () => analysiere(!!P.review);
  $('zurueck').onclick = () => setze(t - 10); $('vor').onclick = () => setze(t + 10);
  $('spielen').onclick = () => { spielt = !spielt; $('spielen').textContent = spielt ? '⏸' : '▶'; letzterTakt = performance.now(); };
  $('zeitleiste').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); setze((e.clientX - r.left) / r.width * P.dauer); };
  $('senden').onclick = frage;
  $('frage').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); frage(); } };
  zeigeReview(); zeitleiste(); zeigeGespraech(); setze(P.momente.find(m => m.art === 'tod')?.von ?? 60);
  if (P.status === 'laeuft') warteAufReview();
}

function zeigeReview() {
  const r = P.review;
  $('analyse').textContent = r ? 'Review neu erstellen' : 'Review erstellen';
  if (!r) { $('status').textContent = P.status && P.status !== 'fertig' ? P.status : ''; return; }
  $('zusammenfassung').hidden = false;
  $('zusammenfassung').innerHTML = `<h2>Zusammenfassung</h2><p>${esc(r.zusammenfassung || '')}</p>`
    + (r.naechste_partie ? `<p><b>Fokus für die nächste Partie:</b> ${esc(r.naechste_partie)}</p>` : '');
  const sprung = z => { const m = /(\d{1,2}):(\d{2})/.exec(z || ''); return m ? +m[1] * 60 + +m[2] : null; };
  const karte = (l, staerke) => {
    const s = sprung(l.zeit);
    return `<div class="lektion ${staerke ? 'staerke' : 'w' + (l.wichtigkeit || 3)}">
      <h3><span>${esc(l.titel || '')}</span>${s !== null ? `<a class="zeit" data-t="${s}">${esc(l.zeit)}</a>` : ''}</h3>
      ${l.was ? `<p><span class="label">${staerke ? 'Gut' : 'Was passiert ist'}</span><br>${esc(l.was)}</p>` : ''}
      ${l.warum ? `<p><span class="label">Warum</span><br>${esc(l.warum)}</p>` : ''}
      ${l.besser ? `<p><span class="label">Besser</span><br>${esc(l.besser)}</p>` : ''}
      ${l.beleg?.length ? `<ul>${l.beleg.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}</div>`;
  };
  $('lektionen').innerHTML = '<h2>Lektionen</h2>' + (r.lektionen || []).map(l => karte(l, false)).join('')
    + ((r.staerken || []).length ? '<h2 style="margin-top:12px">Stärken</h2>' + r.staerken.map(l => karte(l, true)).join('') : '');
  $('lektionen').querySelectorAll('a.zeit').forEach(a => a.onclick = () => setze(+a.dataset.t));
}

async function analysiere(neu) {
  $('status').textContent = 'Coach schreibt das Review … (1-3 Minuten)';
  await json(`/api/partie/${stamm}/analyse`, { method: 'POST', body: JSON.stringify({ neu }) });
  warteAufReview();
}

async function warteAufReview() {
  const s = stamm;
  while (s === stamm) {
    await new Promise(r => setTimeout(r, 4000));
    const d = await json(`/api/partie/${s}`);
    if (s !== stamm) return;
    if (d.status && d.status.startsWith('Fehler')) { $('status').textContent = d.status; return; }
    if (d.status === 'fertig' || (d.review && d.status !== 'laeuft')) { P.review = d.review; P.status = d.status; zeigeReview(); $('status').textContent = ''; return; }
  }
}

function zeitleiste() {
  const svg = $('zeitleiste'), B = svg.clientWidth || 1000, H = 120, mid = 70;
  const x = s => s / P.dauer * B;
  const ds = P.sekunden.map(s => s.d), max = Math.max(1000, ...ds.map(Math.abs));
  const y = d => mid - d / max * 45;
  let pfad = P.sekunden.map((s, i) => `${i ? 'L' : 'M'}${x(s.t).toFixed(1)},${y(s.d).toFixed(1)}`).join('');
  let inhalt = `<line x1="0" x2="${B}" y1="${mid}" y2="${mid}" stroke="#223040"/>`
    + `<path d="${pfad}" fill="none" stroke="#4aa3ff" stroke-width="1.5" opacity=".8"/>`;
  for (let m = 5; m * 60 < P.dauer; m += 5) inhalt += `<text x="${x(m * 60)}" y="${H - 2}" fill="#8b9bb0" font-size="11" text-anchor="middle">${m}</text>`;
  const reihe = { tod: 8, kampf: 20, objective: 32, horten: 44, schwung: 44, lane: 32 };
  for (const m of P.momente) {
    const x0 = x(m.von), x1 = Math.max(x0 + 3, x(m.bis));
    inhalt += `<rect x="${x0}" y="${reihe[m.art] ?? 44}" width="${x1 - x0}" height="8" rx="2" fill="${FARBE[m.art] || '#888'}" opacity="${m.art === 'schwung' ? .5 : .9}"><title>${uhr(m.von)} ${esc(m.titel)}</title></rect>`;
  }
  inhalt += `<line id="cursor" x1="0" x2="0" y1="0" y2="${H - 14}" stroke="#ffd24a" stroke-width="2"/>`;
  svg.setAttribute('viewBox', `0 0 ${B} ${H}`); svg.innerHTML = inhalt;
}

function sekunde(z) {
  const s = P.sekunden; let lo = 0, hi = s.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (s[m].t <= z) lo = m; else hi = m - 1; }
  return s[lo];
}

function setze(z) {
  if (!P) return;
  t = Math.max(0, Math.min(P.dauer, z));
  $('uhr').textContent = uhr(t);
  const c = $('cursor'); if (c) { const X = t / P.dauer * ($('zeitleiste').clientWidth || 1000); c.setAttribute('x1', X); c.setAttribute('x2', X); }
  const s = sekunde(t);
  zeichne(s); werte(s); momente();
}

function zeichne(s) {
  const c = $('karte'), g = c.getContext('2d'), N = c.width;
  g.clearRect(0, 0, N, N);
  if (karte.complete && karte.naturalWidth) g.drawImage(karte, 0, 0, N, N);
  g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(0, 0, N, N);
  const r = N * 0.034;
  for (const sp of P.spieler) {
    const p = s.p[sp.name]; if (!p) continue;
    const [x, y, alter, sicht] = p;
    if (alter > 60) continue;
    g.globalAlpha = sicht ? 1 : Math.max(0.25, 1 - alter / 45);
    g.save(); g.beginPath(); g.arc(x * N, y * N, r, 0, 7); g.clip();
    const i = bild(`/icon/${sp.id}.png`); if (i.complete && i.naturalWidth) g.drawImage(i, x * N - r * 1.15, y * N - r * 1.15, r * 2.3, r * 2.3);
    g.restore();
    g.lineWidth = sicht ? 5 : 3; g.strokeStyle = sp.ich ? '#ffd24a' : sp.freund ? '#4aa3ff' : '#ff5a5a';
    if (!sicht) g.setLineDash([8, 6]);
    g.beginPath(); g.arc(x * N, y * N, r, 0, 7); g.stroke(); g.setLineDash([]);
    if (!sicht && alter >= 2) { g.font = `bold ${Math.round(N * .022)}px Segoe UI`; g.textAlign = 'center'; g.lineWidth = 4; g.strokeStyle = '#000'; g.fillStyle = '#fff';
      g.strokeText(`${Math.round(alter)}s`, x * N, y * N + r + N * .026); g.fillText(`${Math.round(alter)}s`, x * N, y * N + r + N * .026); }
    g.globalAlpha = 1;
  }
}

function werte(s) {
  const namen = Object.fromEntries(P.spieler.map(x => [x.name, x.champion]));
  const tote = s.x.map(n => namen[n] || n);
  $('werte').innerHTML = [
    ['Gold', s.g == null ? '–' : Math.round(s.g)], ['Leben', s.l == null ? '–' : Math.round(s.l * 100) + ' %'],
    ['Kills', `${s.k[0]} : ${s.k[1]}`], ['Items', (s.d > 0 ? '+' : '') + s.d],
    ['Tot', tote.length ? tote.join(', ') : '–']].map(([k, v]) => `<div class="klein">${k}<br><b style="color:var(--text)">${esc(String(v))}</b></div>`).join('');
}

function momente() {
  const nah = P.momente.filter(m => m.von - 20 <= t && t <= m.bis + 20 && m.art !== 'lane');
  $('momente').innerHTML = nah.length ? nah.map(m => `<div class="moment"><b style="color:${FARBE[m.art]}">${uhr(m.von)}–${uhr(m.bis)} ${esc(m.titel)}</b>
      <ul>${m.fakten.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>`).join('') : 'Hier ist nichts Besonderes passiert.';
}

function zeigeGespraech() {
  $('gespraech').innerHTML = (P.gespraech || []).map(e => `<div class="blase ${e.wer === 'Coach' ? 'coach' : 'spieler'}">${esc(e.text)}</div>`).join('');
  $('gespraech').scrollTop = 1e9;
}

async function frage() {
  const text = $('frage').value.trim(); if (!text) return;
  $('frage').value = '';
  P.gespraech = [...(P.gespraech || []), { wer: 'Spieler', text }, { wer: 'Coach', text: 'denkt nach …' }];
  zeigeGespraech();
  const d = await json(`/api/partie/${stamm}/frage`, { method: 'POST', body: JSON.stringify({ text, zeit: Math.round(t) }) });
  P.gespraech[P.gespraech.length - 1] = { wer: 'Coach', text: d.antwort || d.fehler || 'Keine Antwort.' };
  zeigeGespraech();
}

function neuZeichnen() { if (P && document.getElementById('karte')) setze(t); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function takt(jetzt) {
  if (spielt && P) { const dt = (jetzt - letzterTakt) / 1000 * +$('tempo').value; letzterTakt = jetzt; setze(t + dt); if (t >= P.dauer) { spielt = false; $('spielen').textContent = '▶'; } }
  else letzterTakt = jetzt;
  requestAnimationFrame(takt);
}
requestAnimationFrame(takt);
window.onresize = () => P && (zeitleiste(), setze(t));
liste();
</script>
</body>
</html>
