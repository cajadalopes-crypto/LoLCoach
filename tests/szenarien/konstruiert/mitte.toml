# Konstruierte Lagen zu Buch 5 (Mid-Game als Toplaner) - Modi SEITE, GRUPPE, UNTERWEGS, VERTEIDIGEN.
# Grundformat wie lane.toml (Kopfkommentar dort). Zusaetzliche Felder:
#   modus       = "SEITE" / "GRUPPE" / "UNTERWEGS" / "VERTEIDIGEN"
#   ich.bereich = Bereich-Code (Buch 0, 4.2), z. B. "lane:Top", "lane:Mid", "fluss_unten", "basis_eigen"
#   wellen      = { Top = { zustand, unsere, ihre }, Mid = {...}, Bot = {...} }   - alle drei Lanes (Buch 5, 1)
#   mitspieler  = [ { champion, bereich, leben } ]
#   gegner      = [ { champion, rolle, bereich, seit (0 = sichtbar; fehlt = unbekannt), abstand, tot_noch, tp_in } ]
#   antwort_kraft = kraft_gegen gegen den Gegner, der dich auf dieser Seite wahrscheinlich stoppen kommt (Buch 5, 3.1)
#   tuerme      = { ihre = ["Top:innen", ...], eure = [...] }  - STEHENDE Tuerme ("Lane:Stufe", Stufe aussen/innen/Inhib)
#   inhibs_weg  = { eure = ["Mid"], ihre = [] }
#   objectives  = [ { schl, spawn_in, weg, seite, lebt } ]
#   teamkampf   = { ort, eigene, gegner, seit, tote_eigene, tote_gegner, dein_weg }   - erkannter Kampf (Buch 5, 1)
#   Rollen: TOP, JUNGLE, MIDDLE, BOTTOM, UTILITY. Carlos ist Riven (TOP), blaue Seite.

[[lage]]
id = "m-split-drueck"
buch = "5"
modus = "SEITE"
zeit = "22:00"
ich = { level = 15, leben = 0.9, gold = 600, tp_in = 0, bereich = "lane:Top" }
wellen = { Top = { zustand = "ZU_IHM", unsere = 7, ihre = 2 } }
antwort_kraft = 1.5
gegner = [
  { champion = "Sett", rolle = "TOP", bereich = "lane:Mid", seit = 0, abstand = 7000 },
  { champion = "Fiddlesticks", rolle = "JUNGLE", bereich = "fluss_unten", seit = 5, abstand = 11000 },
  { champion = "Kai'Sa", rolle = "BOTTOM", bereich = "lane:Bot", seit = 3, abstand = 13000 },
  { champion = "Sona", rolle = "UTILITY", bereich = "lane:Bot", seit = 3, abstand = 13000 },
  { champion = "Galio", rolle = "MIDDLE" },
]
tuerme = { ihre = ["Top:innen", "Top:Inhib", "Mid:aussen", "Mid:innen", "Mid:Inhib", "Bot:aussen", "Bot:innen", "Bot:Inhib"] }
objectives = [ { schl = "drache", spawn_in = 90, weg = 45, seite = "andere" } ]
soll = ["DRUECKEN"]
satz_enthaelt = ["inneren Top-Turm"]
warum = "Du schlaegst Sett, drei sind unten gesehen, TP ist bereit fuer den Drachen: drueck den inneren Top-Turm."

