# Konstruierte Lagen zu Buch 3 (Recall, Tempo, Kauf). Format: lane.toml (Kopfkommentar).
# Zusaetzliche Felder:
#   modus     = "BASIS" / "TOT" (fehlt = "LANE")
#   respawn_in = s (nur TOT)
#   inventar  = { kontrollauge = bool (false), frei = Plaetze (3) }
#   vorher    = { welle = { zustand = ... } }  - Welle deiner Lane beim Recall (fuer WOHIN / TP)
#   drache    = { spawn_in = s } - Drache (andere Kartenseite) fuer die TP-Regel

