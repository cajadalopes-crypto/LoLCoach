# Konstruierte Lagen zu Buch 1 (Welle) - Modus LANE, Top, Champion Riven.
# Kein Nachspielen: kern/testlage.py baut aus den Feldern Merkmale (+ minimale Bewertung) und ruft
# kern/modi/lane.py + wert.py + plan.py direkt (erster Takt, kein Vorplan).
#
# Felder (fehlt eins, gilt der Normalwert in Klammern):
#   id, buch, zeit ("m:ss"), warum
#   ich          = { champion ("Riven"), level, leben (0..1), gold, flash_in (s; 0 = bereit), tp_in (s; fehlt = kein TP) }
#   welle        = { zustand, unsere, ihre, front, trend }  - zustand wird DIREKT gesetzt (Buch 1, 1.4);
#                  die Rohwerte stehen nur zur Anschauung/fuer den Wert. front aus deiner Sicht (0 = deine Basis).
#   kanone_in    = s, bis die naechste Kanone in der Lane ist (Wellen-Uhr)
#   lane_gegner  = { champion ("Sett"), level, leben (fehlt = unbekannt), abstand, sichtbar (true), tot_noch (s),
#                    im_brunnen (false), kommt_naeher (false), kraefte (dein kraefte()[0] gegen ihn; fehlt = 0) }
#   jungler      = { champion ("Fiddlesticks"), p_meine_seite (0..1), seit (s), abstand (fehlt = unbekannt) }
#   kauf         = { lohnt (bool), kern_fertig (bool) }  - statt kaufplan (der haengt am Lexikon-Build)
#   objective    = { schl, spawn_in (s; 0 = lebt), seite ("meine"/"andere"), weg (s) }
#   soll         = mindestens eine dieser Plan-Arten
#   darf_nicht   = keine dieser Plan-Arten
#   satz_enthaelt = (optional) jeder dieser Texte steht im gesprochenen Satz (Gross/klein egal)

[[lage]]
id = "k-crash-dann-back"
buch = "1"
zeit = "5:40"
ich = { level = 6, leben = 0.6, gold = 1400 }
welle = { zustand = "ZU_IHM", unsere = 6, ihre = 2, front = 0.55, trend = 0.03 }
kanone_in = 40
lane_gegner = { level = 5, leben = 0.7, abstand = 1200 }
jungler = { p_meine_seite = 0.3, seit = 40 }
kauf = { lohnt = true }
soll = ["WELLE_REIN_UND_BACK"]
darf_nicht = ["BACK_JETZT", "STAPELN", "ALL_IN"]
warum = "Gold fuer ein Bauteil, deine Welle wandert zu ihm: erst crashen, dann back - sonst verlierst du sie."

