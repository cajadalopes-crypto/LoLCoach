# Szenarien aus Partie 2026-09-27_102112 (Riven gegen Sett, 39:04, Bot-Partie)
# Format und Bedeutung: buecher/00_entscheidungskern.md, Kapitel 12.1.
#
# Jede "lage" wurde am 27.09.2026 durch Nachspielen der Aufnahme mit dem damaligen Code geprueft
# (Bewertung des Takts: Ort, Leben, Gold, Gegner mit Ort/Abstand/"seit", Tote, Objectives).
# Schritt 1 des Umbaus prueft sie erneut; weicht eine ab, wird das Szenario korrigiert und die
# Abweichung in buecher/messungen.md notiert.
#
# Pruefregeln des Laeufers (werkzeuge/szenarien.py):
#   zeit             Zeitpunkt fuer modus/soll/darf_nicht (Plan des Kerns, +-2 s) und fuer "frage"
#   fenster          Zeitraum fuer darf_nicht_sagen, kehrtwenden_max, ansagen_max, muss_ziel;
#                    fehlt es, gilt [zeit-2, zeit+15]
#   modus            erlaubte Modi (nur Kern)
#   soll             mindestens eine dieser Plan-Arten (nur Kern)
#   darf_nicht       keine dieser Plan-Arten im Fenster (nur Kern)
#   darf_nicht_sagen kein gesprochener Satz im Fenster enthaelt einen dieser Texte (Gross/klein egal;
#                    altes System UND Kern)
#   frage            wie per Sprechtaste zur Zeit "zeit"; darf_nicht_sagen/muss_* gelten dann fuer die Antwort
#   muss_nennen_eins mindestens einer dieser Texte kommt vor
#   muss_ziel        ein gesprochener Satz nennt ein aufloesbares Ziel (Lane+Turm, Objective, Name, Ort)
#   muss_item        die Antwort nennt ein Item aus der Ladenliste
#
# Bot-Partie: Kampf-Urteile ("nimm den Kampf an") sind hier nur eingeschraenkt pruefbar. Die Szenarien
# pruefen deshalb vor allem Modus, Ziel, Plan-Treue und Objective-Wahl - das gilt gegen Menschen genauso.

aufnahme = "2026-09-27_102112"
spielmodus = "CLASSIC"
bots = true


[[szenario]]
id = "0517-platte-ohne-flash"
zeit = "5:17"
quelle = "Nachspielen 27.09.: Ansage 5:17 'nimm die Platte mit', Gank 5:37"
lage = """Riven L6, 37 % Leben, Flash weg (noch ~59 s laut HUD; Schritt 1 nachgespielt, vorher ~48 s), 1258 Gold (Lane-Plan: erster Back ab 1337).
Sett seit eben tot (noch 14 s). Welle 7:4 fuer dich, Front in der Mitte.
Fiddlesticks vor 30 s im oberen Fluss gesehen, 5976 Einheiten entfernt. Galio vor 6 s in der Flussmitte.
Kai'Sa und Sona unten sichtbar."""
modus = ["LANE"]
soll = ["WELLE_REIN_UND_BACK", "BACK_JETZT", "ZURUECK", "UNTER_TURM_FARMEN"]   # Auftrag 007, Klasse 9: in GEFAHR ist es ZURUECK
# Auftrag 008, A1: Fiddlesticks war 30 s ungesehen - ungesehene Gefahr ist kein ZURUECK mehr; der sichere Plan "unter
# deinem Turm farmen" ist richtig, geschuetzt bleibt: keine Platte, kein Trade (darf_nicht)
darf_nicht = ["PLATTEN", "ALL_IN", "TRADE"]
darf_nicht_sagen = ["Platte"]
warum = """Der gegnerische Jungler war zuletzt auf deiner Seite; mit 37 % ohne Flash ist ein Gank ein sicherer
Tod mit Kopfgeld. Welle schnell rein und sofort back kostet nichts und bringt dich mit dem Brutalisierer
zurueck. Die Platte ist den Tod nicht wert. Fiddlesticks kam 5:37."""


