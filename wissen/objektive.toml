# Objective-Timer, Sekunden Spielzeit.
#
# STAND: Saison 2026 (Patch 26.1 ff.), am 26.09.2026 nachgeschlagen:
#   - Atakhan ist seit 26.1 entfernt, Baron wieder ab 20:00
#     (esports.gg "Atakhan, Feats of Strength removed")
#   - Herold 15:00, verschwindet 19:45 (wiki.leagueoflegends.com/Rift_Herald)
#   - Larven 8:00, einmal drei Stueck, verschwinden 14:45 (Suche, mehrere Quellen)
#   - Drache 5:00/5:00, Aeltester 6:00 nach dem 4. Drachen, dann 6:00 (am 27.09.2026 nachgeschlagen: Wiki
#     "Dragon pit", Abschnitt Spawn: "Once a team has killed their fourth drake, the camp will now instead spawn
#     the Elder Dragon with a 6 minute respawn timer"; riftpatchnotes Patch 14.3: "First spawn timer is now
#     properly 360 seconds instead of 300 seconds" - die 300 s aus 14.2 waren ein Fehler; 26.1 aendert nichts)
# Inhibitor 5:00: Wiki Inhibitor, geprueft 26.09.2026. Baron-Respawn 6:00: Wiki Baron Nashor (Buch 6, 27.09.2026).
# EventNamen gegen eine echte Partie geprueft (Aufnahme 26.09.2026), ausser BaronKill.
stand = "Patch 26.x, nachgeschlagen 26.09.2026"

# event   = EventName der Live-API, der den Kill meldet
# erster  = erster Spawn
# respawn = Zeit bis zum naechsten Spawn nach dem Kill; fehlt = kommt nicht wieder
# weg     = verschwindet zu dieser Spielzeit, wenn nicht genommen
# anzahl  = so viele Kills, bis das Lager leer ist (Larven melden jede einzeln)

[drache]
name = "Drache"
event = "DragonKill"
erster = 300
respawn = 300

[aeltester]
# erscheint statt des Drachen, sobald ein Team die Seele hat (4 Drachen)
name = "Aeltester Drache"
erster = 360                 # nach dem 4. Drachen (27.09.2026: Wiki Dragon pit + Patch 14.3, s. oben)
respawn = 360
buff = 150                   # Aspekt des Drachen, Sekunden (Wiki Elder Dragon, 27.09.2026)

[larven]
name = "Leerenlarven"
event = "HordeKill"
erster = 480
weg = 885
anzahl = 3

[herold]
name = "Herold"
event = "HeraldKill"
erster = 900
weg = 1185

[baron]
name = "Baron"
event = "BaronKill"
erster = 1200
respawn = 360
buff = 180                   # Hand des Barons, Sekunden (Wiki Baron Nashor, Buch 6 Kapitel 2, 27.09.2026)

[inhibitor]
name = "Inhibitor"
event = "InhibKilled"
respawn = 300
