heilung_ab = 0.05
fertig = "{champion} hat {item} fertig."

[gold]
schwelle = 1300               # ab hier lohnt ein Recall fuer ein Kernteil
erneut_nach = 90              # Sekunden, bis die Erinnerung wiederkommt, solange das Gold liegen bleibt
satz = "Du hast {gold} Gold. Bei der nächsten ruhigen Welle zurück - ungenutztes Gold ist verschenkte Stärke."
viel = 3000                   # ab hier deutlicher
satz_viel = "Du trägst {gold} Gold mit dir herum - das ist mehr als ein ganzes Item. Welle reinschieben und sofort zurück."

[cs]
minuten = [5, 10, 15, 20]
ziel_pro_minute = 8.0         # Diamond+
satz = "Minute {minute}: {cs} CS, {cspm} pro Minute. {champion} hat {gegner_cs}."
satz_ohne_gegner = "Minute {minute}: {cs} CS, {cspm} pro Minute."
unter_ziel = " Ziel sind acht pro Minute."

[tod]
gank = "Gank von {champion}. Ohne Sicht auf den gegnerischen Jungler nicht so weit vorne stehen."
ueberzahl = "Gestorben gegen {anzahl}. Wenn Gegner fehlen, rechne damit, dass sie zu dir kommen."
solo_nachteil = "Solo gegen {champion} verloren - er war {grund}. Erst nachziehen, dann wieder traden."
