BOTTOM = "Der gegnerische Jungler {champion} ist tot, noch {sekunden} Sekunden. Ihr könnt ohne Gankgefahr hart spielen."
UTILITY = "Der gegnerische Jungler {champion} ist tot, noch {sekunden} Sekunden. Ihr könnt ohne Gankgefahr hart spielen und tief Sicht setzen."
JUNGLE = "{champion} ist tot, noch {sekunden} Sekunden. Sein Jungle ist offen - Camps klauen oder ein Objective nehmen."

[jungler_tot_objective]
# Jungler tot UND ein Objective lebt oder kommt, bevor er zurueck ist.
# nah: das Objective liegt auf deiner Seite; fern: dein Team muss es machen.
nah = "{champion} ist tot, noch {sekunden} Sekunden. {objective} jetzt - er kann nicht kontern."
fern = "{champion} ist tot, noch {sekunden} Sekunden. Ping {objective} für dein Team und nutz die Zeit auf deiner Lane."

[seiten]
# Welche Rollen ein Objective in der Regel selbst erreichen (Rest: "fern").
drache = ["JUNGLE", "MIDDLE", "BOTTOM", "UTILITY"]
larven = ["JUNGLE", "MIDDLE", "TOP"]
herold = ["JUNGLE", "MIDDLE", "TOP"]
baron = ["JUNGLE", "MIDDLE", "TOP", "BOTTOM", "UTILITY"]
