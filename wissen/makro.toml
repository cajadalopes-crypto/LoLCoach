[jungler_tot]
min_sekunden = 15
alle = "{champion} ist tot, noch {sekunden} Sekunden."
TOP = "Der gegnerische Jungler {champion} ist tot, noch {sekunden} Sekunden. Du kannst ohne Gankgefahr pushen und traden."
