# Makro-Regelwerk: WANN der Coach etwas sagt und WAS.
#
# Jede Regel in lolcoach/regeln.py liest hier ihre Schwellen und Saetze.
# Saetze duerfen Platzhalter tragen: {champion}, {sekunden}, {objective},
# {anzahl}, {item}, {gold}, {cs}, {cspm}, {gegner_cs}, {minute}, {level}.
# Rollen: TOP, JUNGLE, MIDDLE, BOTTOM, UTILITY; "alle" gilt, wenn die Rolle fehlt.
# Ein leerer Satz ("") heisst: fuer diese Rolle schweigen.
#
# Grundsatz: jede Ansage sagt, was zu tun ist UND warum - kurz genug, dass
# sie waehrend des Spielens ankommt (Faustregel: unter 5 Sekunden Sprechzeit).
stand = "Grundgeruest 26.09.2026 - allgemeines Makro, noch kein Matchup-Wissen"

[vorwarnung]
vorlauf = 60                  # Sekunden vor dem Spawn

[vorwarnung.drache]
alle = "Drache in einer Minute."
TOP = "Drache in einer Minute. Schieb deine Welle rein, dann kannst du per Teleport mitkämpfen oder oben Druck machen."
TOP_ohne_tp = "Drache in einer Minute. Ohne Teleport bist du zu weit weg - nutz die Zeit oben: Welle pushen, Platten, Turm."
JUNGLE = "Drache in einer Minute. Prüf, ob Bot und Mid Prio haben, und setz vorher Sicht am Fluss."
MIDDLE = "Drache in einer Minute. Schieb deine Welle rein, damit du vor dem Mid-Gegner am Fluss bist."
BOTTOM = "Drache in einer Minute. Welle reinschieben - wer zuerst am Pit ist, bestimmt den Kampf."
UTILITY = "Drache in einer Minute. Sicht vor dem Pit setzen, solange eure Welle Druck macht."

[vorwarnung.drache_seele]
alle = "Drache in einer Minute - und er entscheidet die Seele. Alle Wellen vorher rein, niemand stirbt davor."

[vorwarnung.larven]
TOP = "Larven in einer Minute. Welle reinschieben, damit du deinem Jungler oben helfen kannst."
JUNGLE = "Larven in einer Minute. Plane deinen Clear so, dass du oben bist, wenn Top und Mid Prio haben."
MIDDLE = "Larven in einer Minute. Mit Prio auf deiner Welle kannst du deinem Jungler oben helfen."
BOTTOM = ""
UTILITY = ""
alle = "Larven in einer Minute."

[vorwarnung.herold]
TOP = "Herold in einer Minute. Welle vorbereiten - der Herold ist auf deiner Seite."
JUNGLE = "Herold in einer Minute. Oben Prio prüfen und Sicht an der Grube setzen."
MIDDLE = "Herold in einer Minute. Mit Prio kannst du beim Herold helfen."
BOTTOM = ""
UTILITY = ""
alle = "Herold in einer Minute."

[vorwarnung.baron]
alle = "Baron in einer Minute. Seitenwellen jetzt rausschieben, dann gemeinsam Sicht um die Grube."

[jungler_tot]
min_sekunden = 15
alle = "{champion} ist {sekunden} Sekunden tot."
TOP = "{champion}, der Jungler, ist {sekunden} Sekunden tot. Du kannst ohne Gankgefahr pushen und traden."
MIDDLE = "{champion}, der Jungler, ist {sekunden} Sekunden tot. Du kannst frei pushen oder zum Fluss gehen."
BOTTOM = "{champion}, der Jungler, ist {sekunden} Sekunden tot. Ihr könnt ohne Gankgefahr hart spielen."
UTILITY = "{champion}, der Jungler, ist {sekunden} Sekunden tot. Ihr könnt ohne Gankgefahr hart spielen und tief Sicht setzen."
JUNGLE = "{champion} ist {sekunden} Sekunden tot. Sein Jungle ist offen - Camps klauen oder ein Objective nehmen."

[jungler_tot_objective]
# Jungler tot UND ein Objective lebt oder kommt, bevor er zurueck ist.
# nah: das Objective liegt auf deiner Seite; fern: dein Team muss es machen.
nah = "{champion} ist {sekunden} Sekunden tot. {objective} jetzt - er kann nicht kontern."
fern = "{champion} ist {sekunden} Sekunden tot. Ping {objective} für dein Team und nutz die Zeit auf deiner Lane."

[seiten]
# Welche Rollen ein Objective in der Regel selbst erreichen (Rest: "fern").
drache = ["JUNGLE", "MIDDLE", "BOTTOM", "UTILITY"]
larven = ["JUNGLE", "MIDDLE", "TOP"]
herold = ["JUNGLE", "MIDDLE", "TOP"]
baron = ["JUNGLE", "MIDDLE", "TOP", "BOTTOM", "UTILITY"]
nicht_mehr_vor_weg = 30       # so knapp vor dem Verschwinden schickt der Coach niemanden mehr hin

[lane_tot]
min_sekunden = 10
platten_bis = 840             # 14:00 - danach keine Turmplatten mehr
mit_platten = "{champion} ist {sekunden} Sekunden tot. Welle in den Turm schieben und Platten holen."
ohne_platten = "{champion} ist {sekunden} Sekunden tot. Welle reinschieben, dann Turm, Recall oder zum Objective."

[zahlen]
min_sekunden = 12             # nur Gegner zaehlen, die mindestens so lange tot bleiben
vorteil_objective = "{anzahl} Gegner tot für {sekunden} Sekunden. {objective} jetzt - sie können nicht verteidigen."
vorteil_turm = "{anzahl} Gegner tot für {sekunden} Sekunden. Jetzt Türme drücken, solange sie fehlen."
nachteil = "Ihr seid {sekunden} Sekunden lang zu {anzahl}. Nicht kämpfen - Objective lieber abgeben als noch jemanden verlieren."

