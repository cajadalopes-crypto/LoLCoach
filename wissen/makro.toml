gegner_6 = "{champion} hat Level 6, du noch nicht. Keine langen Trades, bis du nachziehst."
ich_6 = "Du hast Level 6 vor {champion}. Das ist dein Fenster für einen All-in."
jungler_6 = "{champion} hat Ultimate. Ganks werden gefährlicher - pushen nur mit Sicht."

[items]
