# Lane-Kurve je Champion (Data-Dragon-ID): wie stark er in welcher Phase im 1-gegen-1 ist.
# [frueh, sechs, spaet] je -2 .. +2:
#   frueh = Level 1-5 (Lane-Bully +2, farmt nur -2), sechs = der Level-6-Sprung (Ult entscheidet Kaempfe +2),
#   spaet = Skalierung (Hyper-Carry +2, faellt ab -2).
# Abgeleitet am 26.09.2026 aus den Powerspike-/Schwaechephasen-Abschnitten des Champion-Lexikons
# (wissen/lexikon/champions/*.md) und Spielwissen - grob, fuer die Faktor-Summe der Denkkette (denker.py),
# nicht fuer Matchup-Tabellen. Reasoning #1/#23: "Wer gewinnt den Trade kurz-, mittel- und langfristig?"
stand = "abgeleitet 26.09.2026 aus dem Lexikon, grob"

# Champions, die sich eine Zone bauen (Geschuetze, Pflanzen, Soldaten, Tentakel, Ghule, Pilze, Boxen):
# in ihrer Zone zu kaempfen ist schlechter, als Level und Items sagen (Live 26.09.: Riven starb 11:08 an
# Heimerdinger an seinem Turm).
zone = ["Heimerdinger", "Zyra", "Azir", "Illaoi", "Yorick", "Teemo", "Shaco"]

